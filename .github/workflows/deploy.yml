name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./prisha-ugc-portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prisha-ugc-portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GITHUB_ACTIONS: true
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./prisha-ugc-portfolio/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Pages artifact
        uses: actions/download-pages-artifact@v2
        with:
          path: ./prisha-ugc-portfolio/dist

      - name: Deploy to `gh-pages` branch
        id: deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./prisha-ugc-portfolio/dist
          publish_branch: gh-pages
          keep_files: false

      - name: Ensure Pages source set to `gh-pages` branch
        id: set-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Setting Pages source to gh-pages branch"
          curl -sSf -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}'

      - name: Retrieve published URL
        id: deployment
        run: |
          echo "page_url=$(gh api repos/$GITHUB_REPOSITORY/pages --jq .html_url)" >> $GITHUB_OUTPUT
